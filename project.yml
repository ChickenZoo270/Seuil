name: Intention
options:
  bundleIdPrefix: com.chickenzoo.seuil
  deploymentTarget:
    iOS: "26.0"
packages:
  IntentionCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Empty unless the TestFlight workflow passes SEUIL_PROFILE_<Target> for manual signing.
    PROVISIONING_PROFILE_SPECIFIER: $(SEUIL_PROFILE_$(TARGET_NAME))
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    INTENTION_APP_GROUP: group.com.chickenzoo.seuil
    GENERATE_INFOPLIST_FILE: NO
targetTemplates:
  Extension:
    type: app-extension
    platform: iOS
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/Intention.entitlements
targets:
  Intention:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: IntentionCore
      - target: ShieldConfiguration
        embed: true
      - target: ShieldAction
        embed: true
      - target: Monitor
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chickenzoo.seuil
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Configuration/Intention.entitlements
    info:
      path: Configuration/App-Info.plist
      properties:
        CFBundleDisplayName: Seuil
        ITSAppUsesNonExemptEncryption: false
        IntentionAppGroup: $(INTENTION_APP_GROUP)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  ShieldConfiguration:
    templates: [Extension]
    sources: [Extensions/ShieldConfiguration]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chickenzoo.seuil.shieldconfiguration
    info:
      path: Configuration/ShieldConfiguration-Info.plist
      properties:
        IntentionAppGroup: $(INTENTION_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
  ShieldAction:
    templates: [Extension]
    sources: [Extensions/ShieldAction, Shared]
    dependencies:
      - package: IntentionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chickenzoo.seuil.shieldaction
    info:
      path: Configuration/ShieldAction-Info.plist
      properties:
        IntentionAppGroup: $(INTENTION_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
  Monitor:
    templates: [Extension]
    sources: [Extensions/Monitor, Shared]
    dependencies:
      - package: IntentionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chickenzoo.seuil.monitor
    info:
      path: Configuration/Monitor-Info.plist
      properties:
        IntentionAppGroup: $(INTENTION_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
schemes:
  Intention:
    build:
      targets:
        Intention: all
