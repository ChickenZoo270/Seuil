name: Simulator launch smoke test
on:
  push:
    paths: ['.github/workflows/simulator.yml', 'App/**', 'Shared/**', 'Core/**', 'Extensions/**', 'UITests/**', 'project.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and generate project
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Build, install and launch in iPhone simulator
        run: |
          set -euo pipefail
          mkdir -p simulator-evidence
          xcrun simctl list devices available --json > simulator-evidence/devices.json
          DEVICE_ID=$(jq -r '[.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | sort_by(if .name == "iPhone 16 Pro" then 0 else 1 end) | .[0].udid // empty' simulator-evidence/devices.json)
          test -n "$DEVICE_ID"
          xcodebuild -project Intention.xcodeproj -scheme Intention -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath SimulatorBuild CODE_SIGNING_ALLOWED=NO build > simulator-evidence/build.log 2>&1
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" SimulatorBuild/Build/Products/Debug-iphonesimulator/Intention.app
          xcrun simctl launch "$DEVICE_ID" com.chickenzoo.seuil | tee simulator-evidence/launch.log
          APP_PID=$(awk '/com.chickenzoo.seuil:/ {print $NF}' simulator-evidence/launch.log)
          test -n "$APP_PID"
          sleep 8
          kill -0 "$APP_PID"
          xcrun simctl io "$DEVICE_ID" screenshot simulator-evidence/launch.png
          xcrun simctl terminate "$DEVICE_ID" com.chickenzoo.seuil
          xcrun simctl launch "$DEVICE_ID" com.chickenzoo.seuil | tee simulator-evidence/relaunch.log
          APP_PID=$(awk '/com.chickenzoo.seuil:/ {print $NF}' simulator-evidence/relaunch.log)
          test -n "$APP_PID"
          sleep 5
          kill -0 "$APP_PID"
          xcrun simctl io "$DEVICE_ID" screenshot simulator-evidence/relaunch.png
      - name: Run UI tests (onboarding, challenges, routines)
        run: |
          set -euo pipefail
          DEVICE_ID=$(jq -r '[.devices | to_entries[] | select(.key | contains("iOS-26")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | sort_by(if .name == "iPhone 16 Pro" then 0 else 1 end) | .[0].udid // empty' simulator-evidence/devices.json)
          mkdir -p simulator-evidence/screens
          # Ad hoc signing keeps the App Group entitlement, so shared settings persist.
          xcodebuild test -project Intention.xcodeproj -scheme Intention             -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath UITestBuild             -resultBundlePath simulator-evidence/UITests.xcresult             TEST_RUNNER_SCREENSHOT_DIR="$PWD/simulator-evidence/screens"             CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= 2>&1 | tee simulator-evidence/uitests.log | grep -E "Test Case|error:|failed|passed|TEST (SUCCEEDED|FAILED)"
      - name: Preserve simulator evidence (not a Screen Time device test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-launch-evidence
          path: simulator-evidence/
          retention-days: 7
